# ***QuESt Planning Configuration File***

#********************Data Folder********************
data_folder: 'rts_csv_data_zonal'

#********************Scenario Configuration********************
scenario: RTS_GMLC_zonal
system: RTS_GMLC_Zonal
tx_model: Transportation
trans_expansion: False
load_growth: 1.5
load_forecast: system_wide
es_cost: Base
ldes_switch: False

#********************Time Horizon********************
start_year: 2024
end_year: 2040
#year_gap: 16
years:
  - 2024
  - 2032
  - 2040

#********************Economic Parameters********************
discount_rate: 5
base_curr_year: 2021
end_effects: 10
voll: 100000
tax_credit_end_year: 2032

#********************Energy Storage Options********************
soc_max: 80
soc_min: 20
ini_level: 50
es_lifetime_extension: 50

#********************Modeling Options:********************
block_selection: Repr_3Days_Season #Options are: "seasonal_blocks", "Repr_3Days_Season", "Repr_Weeks"
reserves_option: True
tax_credits_option: False
es_lifetime_cost_option: True
rps_policy: False
co2_policy: False
co2_intensity_policy: False
mva_base: 100

#********************Candidate Technologies - NOT ACTIVE********************


#********************Limit by Buses********************
limit_by_buses: null
  #- bus_num: 1
   # solar: 1000
   # wind: 0
   # storage: 750


#********************System-wide resource limits********************
system_wide_wind_max: 10000000
system_wide_solar_max: 150000000
system_wide_gas_max: 0
system_wide_tx_expansion_max: 3000

#********************Reserves Parameters********************
prm: 20
reg_res_req: 1
spin_res_req: 3
flex_res_req: 3

#********************Custom Retirements********************
custom_retirement: False
ng_retirement_year: None
coal_retirement_year: None
nuclear_retirement_year: None
oil_retirement_year: None

#********************Solver********************
solver: gurobi

#********************Plotting Options********************
stacked_bar_by_bus: False
policy_plot_option: False

#********Reliability_assessment using ProGRESS tool***************
run_reliability_assessment: false 

rel_evaluation_years: #Investment years for which you want to evaluate reliability. Leave empty if you do not want to run ProGRESS simulations.
 #- 2024
 - 2032
 #- 2040

progress_sim_mode: "Nodal" #Choices are: "Zonal" or "Nodal" or  "Copper Sheet"

#If you want to reuse previously downloaded and renewable data, set the full renewable path. Leave empty to download data, must have the cdsapi key present.
ren_data_dir: "./quest_planning/data_explan/data_for_ProGRESS/Zonal"  

num_sample_paths: 1 # How many sample years to simulate
num_hours: 100 # How many hours to simulate within each sample, default is 8760 hours
num_mpi_processes: 0 # Provide a value to use MPI for ProGRESS. If 0, MPI is not used. (number of samples becomes num_mpi_process*num_sample_paths)

#********Production Cost Modeling using QuESt PCM tool***************
pcm_evaluation_years: #Investment years for which you want to evaluate reliability. Leave empty if you do not want to run ProGRESS simulations.
# - 2024
# - 2032
# - 2040
detailed_pcm_gen_data: True #If set to True, users ned to populate pcm_gen.csv, else default generator data are populated
simulate_pcm: False #If set to True, QuESt will simulate PCM for the investment years specified in pcm_evaluation_years. By default, only PCM compatible data is exported
mipgap: 0.01 #MIP gap for PCM MILP optimization, default is 0.01
pcm_hours: 24 #Starting in January, how many hours to simulate within each investment year, default is 24 hours
pcm_start_date: 01/01 #Optional: mm/dd to start PCM simulation, default is 01/01
